<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex — AI Life Navigator (Testing)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  background: #1e293b;
  padding: 12px 20px;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.header h1 { font-size: 18px; font-weight: 600; color: #38bdf8; }
.header .controls { display: flex; gap: 8px; }
.header button {
  padding: 6px 14px;
  border: 1px solid #475569;
  border-radius: 6px;
  background: #1e293b;
  color: #cbd5e1;
  cursor: pointer;
  font-size: 13px;
}
.header button:hover { background: #334155; }
.header button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user {
  align-self: flex-end;
  background: #2563eb;
  color: #fff;
  border-bottom-right-radius: 4px;
}
.message.alex {
  align-self: flex-start;
  background: #1e293b;
  border: 1px solid #334155;
  border-bottom-left-radius: 4px;
}
.message.alex .label {
  font-size: 11px;
  color: #38bdf8;
  font-weight: 600;
  margin-bottom: 4px;
}

.options-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 4px 20px 8px;
}
.option-btn {
  padding: 8px 16px;
  border: 1px solid #38bdf8;
  border-radius: 20px;
  background: transparent;
  color: #38bdf8;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.option-btn:hover { background: #38bdf8; color: #0f172a; }

.checklist {
  padding: 4px 20px 8px;
}
.checklist .task {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
  color: #94a3b8;
}
.checklist .task .day {
  background: #334155;
  color: #38bdf8;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

.input-area {
  padding: 12px 20px;
  border-top: 1px solid #334155;
  display: flex;
  gap: 8px;
  background: #1e293b;
  flex-shrink: 0;
}
.input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #475569;
  border-radius: 8px;
  background: #0f172a;
  color: #e2e8f0;
  font-size: 14px;
  outline: none;
}
.input-area input:focus { border-color: #38bdf8; }
.input-area button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #38bdf8;
  color: #0f172a;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.input-area button:hover { background: #7dd3fc; }
.input-area button:disabled { opacity: 0.5; cursor: default; }

.status {
  font-size: 11px;
  color: #64748b;
  padding: 0 20px 4px;
  flex-shrink: 0;
}

.thinking { color: #38bdf8; font-style: italic; }
</style>
</head>
<body>

<div class="header">
  <h1>Alex — AI Life Navigator</h1>
  <div class="controls">
    <button onclick="resetSession()" id="btnReset">New Chat</button>
  </div>
</div>

<div class="chat-area" id="chat"></div>

<div class="options-row" id="options"></div>
<div class="checklist" id="checklist"></div>

<div class="status" id="status">Tell Alex what's going on below — he'll figure out the right journey.</div>

<div class="input-area" id="inputArea" style="display:none">
  <input id="input" type="text" placeholder="Type your reply..."
    onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()" id="sendBtn">Send</button>
</div>

<script>
const API = 'http://localhost:5000';
let userId = 'chat_' + Math.random().toString(36).slice(2, 8);

document.addEventListener('DOMContentLoaded', () => {
  sendToApi('');
});

function scrollToBottom() {
  const el = document.getElementById('chat');
  el.scrollTop = el.scrollHeight;
}

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'message ' + sender;
  if (sender === 'alex') {
    const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    div.innerHTML = '<div class="label">ALEX</div>' + escaped.replace(/\n/g, '<br>');
  } else {
    div.textContent = text;
  }
  document.getElementById('chat').appendChild(div);
  scrollToBottom();
}

function clearOptions() {
  document.getElementById('options').innerHTML = '';
  document.getElementById('checklist').innerHTML = '';
  document.getElementById('inputArea').style.display = 'none';
}

function showOptions(options) {
  const row = document.getElementById('options');
  row.innerHTML = '';
  if (options && options.length > 0) {
    document.getElementById('inputArea').style.display = 'none';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        addMessage(opt, 'user');
        clearOptions();
        sendToApi(opt);
      };
      row.appendChild(btn);
    });
  } else {
    document.getElementById('inputArea').style.display = 'flex';
  }
}

function showChecklist(tasks) {
  const el = document.getElementById('checklist');
  el.innerHTML = '';
  tasks.forEach(t => {
    const div = document.createElement('div');
    div.className = 'task';
    div.innerHTML = `<span class="day">${t.day}</span> ${t.task}`;
    el.appendChild(div);
  });
  const btn = document.createElement('button');
  btn.className = 'option-btn';
  btn.textContent = 'Continue';
  btn.style.marginTop = '10px';
  btn.onclick = () => {
    addMessage('continue', 'user');
    clearOptions();
    document.getElementById('checklist').innerHTML = '';
    sendToApi('continue');
  };
  el.appendChild(btn);
}

async function sendMessage() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  addMessage(msg, 'user');
  clearOptions();
  await sendToApi(msg);
}

async function sendToApi(msg) {
  const btn = document.getElementById('sendBtn');
  const input = document.getElementById('input');
  const status = document.getElementById('status');
  btn.disabled = true;
  input.disabled = true;
  status.innerHTML = '<span class="thinking">Alex is thinking...</span>';

  try {
    const r = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, message: msg })
    });
    const data = await r.json();

    addMessage(data.text, 'alex');

    showOptions(data.options);

    if (data.checklist && data.checklist.length > 0) {
      showChecklist(data.checklist);
    }

    const treeLabel = data.tree === 'j2' ? 'Aged Out of Foster Care' : 'Kicked Out';
    const nodeInfo = data.node_id ? ` (${data.node_id})` : '';
    const llmInfo = data.llm ? ' [LLM]' : ' [fallback]';
    status.textContent = `${treeLabel} | Node: ${data.node_id || 'end'}${llmInfo}`;
  } catch (e) {
    addMessage('Error connecting to Alex. Make sure the server is running (python server.py)', 'alex');
    status.textContent = 'Connection error — server may be offline';
  }

  btn.disabled = false;
  input.disabled = false;
  input.focus();
}

async function resetSession() {
  clearOptions();
  document.getElementById('chat').innerHTML = '';
  document.getElementById('inputArea').style.display = 'none';
  try {
    await fetch(API + '/reset/' + userId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tree: 'j1' })
    });
    document.getElementById('status').textContent =
      'New chat. Tell Alex what is going on.';
    document.getElementById('input').focus();
  } catch (e) {
    document.getElementById('status').textContent = 'Connection error';
  }
}

function updateTreeButtons() {}
</script>

</body>
</html>
